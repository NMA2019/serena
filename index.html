<!DOCTYPE html>
<!--
  SERENA — Suivi personnel de santé (cycle, fertilité, grossesse)
  Version: 1.0.0
  Architecture: fichier unique index.html (HTML+CSS+JS), aucune dépendance externe,
  aucun framework, stockage 100% local (IndexedDB + localStorage pour préférences non sensibles).
  Fonctionnalités: onboarding, dashboard, calendrier, cycle, fertilité (estimations),
  température basale (canvas), journal quotidien (canvas), activité sexuelle, implant,
  grossesse (SA/DPA/trimestre), journal grossesse, contractions, rendez-vous, rappels,
  export PDF (impression), export/import JSON, sécurité PIN (Web Crypto), WebAuthn si dispo,
  i18n FR/EN, thème Light/Dark/Système, PWA (manifest dynamique, tentative Service Worker),
  données de démonstration, auto-tests internes.
  Prérequis navigateur: navigateur moderne (Chrome/Edge/Firefox/Safari récents).
  Limites PWA mono-fichier: le Service Worker et le manifest sont générés dynamiquement via
  Blob URL; certains navigateurs interdisent l'enregistrement d'un SW depuis un Blob — dans ce
  cas le mode offline avancé n'est pas garanti, mais l'application reste utilisable et les
  données restent locales. WebAuthn/Notification/SW nécessitent un contexte sécurisé (HTTPS
  ou localhost). Lancement: ouvrir ce fichier dans un navigateur, ou le servir en HTTPS pour
  activer toutes les fonctions PWA.
  Ce document ne constitue pas un dispositif médical. SERENA ne diagnostique rien.
-->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7C3AED">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="SERENA — Comprendre son corps. Anticiper. Prendre soin de soi.">
<title>SERENA</title>
<style>
/* ===================== CONFIGURATION / DESIGN TOKENS ===================== */
:root{
  --bg:#F8FAFC; --surface:#FFFFFF; --primary:#7C3AED; --accent:#EC4899; --teal:#14B8A6;
  --ink:#172033; --muted:#64748B; --danger:#DC2626; --warn:#F59E0B; --ok:#16A34A;
  --border: rgba(23,32,51,0.10); --shadow: 0 1px 2px rgba(23,32,51,0.06), 0 8px 24px rgba(23,32,51,0.06);
  --radius:16px; --radius-sm:10px; --font-head:'Fraunces','Iowan Old Style','Georgia',serif;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
:root:not([data-theme="light"]) { }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F172A; --surface:#1E293B; --primary:#A78BFA; --accent:#F472B6; --teal:#2DD4BF;
    --ink:#F8FAFC; --muted:#94A3B8; --border: rgba(248,250,252,0.10);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0F172A; --surface:#1E293B; --primary:#A78BFA; --accent:#F472B6; --teal:#2DD4BF;
  --ink:#F8FAFC; --muted:#94A3B8; --border: rgba(248,250,252,0.10);
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body);
  padding-top:var(--safe-top); padding-bottom:var(--safe-bottom); -webkit-tap-highlight-color:transparent;
}
html{scroll-padding-top:var(--safe-top)}
h1,h2,h3,.brand{font-family:var(--font-head)}
button{font-family:inherit}
img,svg{max-width:100%}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms!important; transition-duration:.001ms!important;} }
a{color:var(--primary)}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
button, .btn{min-height:44px;min-width:44px}
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{
  outline:3px solid var(--primary); outline-offset:2px;
}
button{cursor:pointer;border:none;border-radius:var(--radius-sm);background:var(--surface);color:var(--ink)}
.btn-primary{background:var(--primary);color:#fff;padding:12px 18px;font-weight:600;font-size:15px}
.btn-secondary{background:transparent;border:1.5px solid var(--border);padding:12px 18px;font-weight:600;color:var(--ink)}
.btn-danger{background:var(--danger);color:#fff;padding:12px 18px;font-weight:600}
.btn-ghost{background:transparent;padding:8px 10px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
input,select,textarea{
  width:100%;padding:11px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);
  background:var(--bg);color:var(--ink);font-size:15px;font-family:inherit;
}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.section-title{font-size:22px;margin:4px 0 14px;font-weight:600}
.muted{color:var(--muted);font-size:13px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.pill-red{background:rgba(220,38,38,.14);color:var(--danger)}
.pill-green{background:rgba(22,163,74,.14);color:var(--ok)}
.pill-violet{background:rgba(124,58,237,.14);color:var(--primary)}
.pill-grey{background:rgba(100,116,139,.14);color:var(--muted)}
.disclaimer{background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.35);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;color:var(--ink)}

/* ---- App shell ---- */
#app{max-width:1180px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;
  padding:calc(10px + var(--safe-top)) 16px 10px;border-bottom:1px solid var(--border);
}
.topbar .brand{font-weight:700;font-size:19px;display:flex;align-items:center;gap:8px}
.topbar .grow{flex:1}
.sec-state{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
main{flex:1;padding:16px 16px 96px;width:100%}
@media (min-width:1024px){ main{padding:24px 32px 48px} }

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);
  border-top:1px solid var(--border);display:flex;padding-bottom:var(--safe-bottom);
}
.tabbar button{flex:1;background:transparent;border-radius:0;display:flex;flex-direction:column;
  align-items:center;gap:2px;padding:8px 2px;font-size:11px;color:var(--muted);font-weight:600}
.tabbar button[aria-current="page"]{color:var(--primary)}
.tabbar svg{width:22px;height:22px}

.sidebar{display:none}
@media (min-width:1024px){
  #app{flex-direction:row}
  .tabbar{display:none}
  .sidebar{
    display:flex;flex-direction:column;width:230px;flex-shrink:0;border-right:1px solid var(--border);
    padding:18px 12px;gap:2px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;
  }
  .sidebar button{display:flex;align-items:center;gap:10px;justify-content:flex-start;padding:11px 12px;
    font-size:14px;font-weight:600;color:var(--muted);border-radius:var(--radius-sm)}
  .sidebar button[aria-current="page"]{background:rgba(124,58,237,.10);color:var(--primary)}
  .content-col{flex:1;min-width:0}
  .topbar{display:none}
}

/* Splash / lock / onboarding */
.center-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:10px}
.logo-lg{width:96px;height:96px}
.tagline{color:var(--muted);font-size:14px;max-width:280px}
.progress-dots{display:flex;gap:6px;margin-top:18px}
.progress-dots span{width:7px;height:7px;border-radius:50%;background:var(--border)}
.progress-dots span.active{background:var(--primary)}
.pinpad{display:flex;gap:12px;margin:18px 0;justify-content:center}
.pinpad .dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--muted)}
.pinpad .dot.filled{background:var(--primary);border-color:var(--primary)}
.numpad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
.numpad button{width:72px;height:72px;border-radius:50%;background:var(--surface);border:1px solid var(--border);font-size:22px;font-weight:600}

/* Onboarding */
.onb-step{max-width:480px;margin:0 auto}
.onb-illustr{width:100%;height:150px;display:flex;align-items:center;justify-content:center}

/* Calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow{text-align:center;font-size:11px;color:var(--muted);font-weight:700;padding:4px 0}
.cal-day{aspect-ratio:1;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-size:13px;gap:2px}
.cal-day.out{opacity:.35}
.cal-day.today{border-color:var(--primary);border-width:2px}
.cal-day .dots{display:flex;gap:2px;position:absolute;bottom:4px}
.cal-day .dots span{width:5px;height:5px;border-radius:50%}
.dot-period{background:var(--danger)} .dot-fertile{background:var(--ok)} .dot-ovu{background:var(--primary)} .dot-log{background:var(--teal)}

/* Modal / sheet */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){ .overlay{align-items:center} }
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:18px 18px calc(18px + var(--safe-bottom));box-shadow:var(--shadow)}
@media (min-width:640px){ .sheet{border-radius:20px} }
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-head h2{margin:0;font-size:18px}

/* Toast */
#toastwrap{position:fixed;bottom:calc(80px + var(--safe-bottom));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none}
@media (min-width:1024px){ #toastwrap{bottom:24px} }
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;box-shadow:var(--shadow);max-width:90vw}

/* Dashboard cards */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:720px){ .stat-grid{grid-template-columns:repeat(4,1fr)} }
.stat-card .num{font-size:26px;font-weight:700;font-family:var(--font-head)}
.quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
@media (min-width:720px){ .quick-actions{grid-template-columns:repeat(6,1fr)} }
.quick-actions button{display:flex;flex-direction:column;gap:4px;align-items:center;padding:12px 4px;font-size:12px;font-weight:600;border:1px solid var(--border)}

/* Empty state */
.empty{text-align:center;padding:36px 16px;color:var(--muted)}

/* Chart wrapper */
.chart-wrap{width:100%;overflow-x:auto}
canvas.chart{width:100%;height:160px;display:block}

/* Timeline (pregnancy) */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--border)}
.tl-item{position:relative;margin-bottom:14px}
.tl-item::before{content:'';position:absolute;left:-22px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--primary)}

/* Timer big */
.timer-num{font-size:48px;font-family:var(--font-head);font-weight:700;text-align:center;margin:14px 0}
.timer-btn{width:130px;height:130px;border-radius:50%;font-size:16px;font-weight:700;color:#fff;margin:0 auto;display:block}

/* Print */
#print-report{display:none}
@media print{
  body *{visibility:hidden}
  #print-report,#print-report *{visibility:visible}
  #print-report{display:block;position:absolute;left:0;top:0;width:100%;color:#111;background:#fff}
  .no-print{display:none!important}
}
.settings-list button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border:1px solid var(--border);margin-bottom:8px;text-align:left;font-weight:600}
table.hist{width:100%;border-collapse:collapse;font-size:13px}
table.hist th,table.hist td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
.toggle{position:relative;width:44px;height:26px;border-radius:99px;background:var(--border);flex-shrink:0}
.toggle.on{background:var(--primary)}
.toggle span{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle.on span{transform:translateX(18px)}
</style>
</head>

</div>

/* ===================== DATE HELPERS (calendar dates, no TZ drift) ===================== */
S.dt = {
  toISO(y,m,d){ return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; },
  parse(iso){ const [y,m,d] = iso.split('-').map(Number); return {y,m,d}; },
  toSerial(iso){ const {y,m,d}=this.parse(iso); return Date.UTC(y,m-1,d)/86400000; },
  fromSerial(serial){ const dt = new Date(serial*86400000); return this.toISO(dt.getUTCFullYear(), dt.getUTCMonth()+1, dt.getUTCDate()); },
  addDays(iso,n){ return this.fromSerial(this.toSerial(iso)+n); },
  diffDays(isoA,isoB){ return this.toSerial(isoB)-this.toSerial(isoA); },
  todayISO(){ const n=new Date(); return this.toISO(n.getFullYear(), n.getMonth()+1, n.getDate()); },
  fmt(iso, withYear){ if(!iso) return '—'; const {y,m,d}=this.parse(iso);
    const months = S.lang==='fr' ? ['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'] : ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${d} ${months[m-1]}${withYear===false?'':' '+y}`; },
  monthLabel(y,m){ const months = S.lang==='fr' ? ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'] : ['January','February','March','April','May','June','July','August','September','October','November','December'];
    return `${months[m-1]} ${y}`; }
};

S.DB_NAME='SERENA_DB'; S.DB_VERSION=1;
S.STORES=['profile','cycles','periods','dailyLogs','temperatures','sexualActivity','implant','pregnancy','appointments','reminders','contractions','settings','security'];
S.db = null;
S.openDB = function(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('no-indexeddb')); return; }
    const req = indexedDB.open(S.DB_NAME, S.DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      S.STORES.forEach(name=>{
        if(!db.objectStoreNames.contains(name)){
          db.createObjectStore(name, {keyPath:'id', autoIncrement:true});
        }
      });
    };
    req.onsuccess = (e)=>{ S.db = e.target.result; resolve(S.db); };
    req.onerror = ()=> reject(req.error);
  });
};
S.tx = function(store, mode='readonly'){ return S.db.transaction(store, mode).objectStore(store); };
S.dbAdd = function(store, obj){ return new Promise((res,rej)=>{
  const now = new Date().toISOString(); obj.createdAt = obj.createdAt||now; obj.updatedAt = now;
  const r = S.tx(store,'readwrite').add(obj); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
});};
S.dbPut = function(store, obj){ return new Promise((res,rej)=>{
  obj.updatedAt = new Date().toISOString();
  const r = S.tx(store,'readwrite').put(obj); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
});};
S.dbDelete = function(store, id){ return new Promise((res,rej)=>{
  const r = S.tx(store,'readwrite').delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error);
});};
S.dbGetAll = function(store){ return new Promise((res,rej)=>{
  const r = S.tx(store).getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error);
});};
S.dbClear = function(store){ return new Promise((res,rej)=>{
  const r = S.tx(store,'readwrite').clear(); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error);
});};
S.dbClearAll = async function(){ for(const s of S.STORES){ await S.dbClear(s); } };

/* ===================== CRYPTO / SECURITY (PIN) ===================== */
S.crypto = {
  async hashPin(pin, saltB64){
    const enc = new TextEncoder();
    let salt;
    if(saltB64){ salt = Uint8Array.from(atob(saltB64), c=>c.charCodeAt(0)); }
    else { salt = crypto.getRandomValues(new Uint8Array(16)); }
    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pin), {name:'PBKDF2'}, false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'}, keyMaterial, 256);
    const hashB64 = btoa(String.fromCharCode(...new Uint8Array(bits)));
    const saltOut = btoa(String.fromCharCode(...salt));
    return {hash:hashB64, salt:saltOut};
  },
  async verifyPin(pin, storedHash, storedSalt){
    const {hash} = await this.hashPin(pin, storedSalt);
    return hash === storedHash;
  }
};

/* ===================== CYCLE / FERTILITY ALGORITHMS ===================== */
S.calc = {
  calculateCycleDay(periods, refIso){
    if(!periods || !periods.length) return {value:null, confidence:'low'};
    const sorted = [...periods].sort((a,b)=> S.dt.toSerial(b.startDate)-S.dt.toSerial(a.startDate));
    const last = sorted.find(p=> S.dt.toSerial(p.startDate) <= S.dt.toSerial(refIso));
    if(!last) return {value:null, confidence:'low'};
    const day = S.dt.diffDays(last.startDate, refIso) + 1;
    return {value: day, lastStart: last.startDate};
  },
  calculateAverageCycleLength(periods){
    if(!periods || periods.length<2) return {value:null, confidence:'low', n:periods?periods.length:0};
    const sorted = [...periods].sort((a,b)=> S.dt.toSerial(a.startDate)-S.dt.toSerial(b.startDate));
    const lengths = [];
    for(let i=1;i<sorted.length;i++){ lengths.push(S.dt.diffDays(sorted[i-1].startDate, sorted[i].startDate)); }
    const valid = lengths.filter(l=> l>=15 && l<=60);
    if(!valid.length) return {value:null, confidence:'low', n:0};
    const avg = Math.round(valid.reduce((a,b)=>a+b,0)/valid.length);
    const conf = valid.length>=6?'high': valid.length>=3?'medium':'low';
    return {value:avg, confidence:conf, n:valid.length};
  },
  calculateAveragePeriodLength(periods){
    const withEnd = (periods||[]).filter(p=>p.endDate);
    if(!withEnd.length) return {value:null};
    const avg = Math.round(withEnd.reduce((a,p)=> a + S.dt.diffDays(p.startDate,p.endDate) + 1, 0)/withEnd.length);
    return {value:avg};
  },
  predictNextPeriod(periods, defaultLen){
    if(!periods || !periods.length) return {date:null, confidence:'low'};
    const sorted = [...periods].sort((a,b)=> S.dt.toSerial(b.startDate)-S.dt.toSerial(a.startDate));
    const lastStart = sorted[0].startDate;
    const avg = this.calculateAverageCycleLength(periods);
    const len = avg.value || defaultLen || 28;
    return {date: S.dt.addDays(lastStart, len), confidence: avg.confidence||'low', usedLength: len};
  },
  estimateFertileWindow(periods, defaultLen){
    const next = this.predictNextPeriod(periods, defaultLen);
    if(!next.date) return {start:null,end:null,confidence:'low'};
    return {start: S.dt.addDays(next.date, -18), end: S.dt.addDays(next.date, -11), confidence: next.confidence};
  },
  estimateOvulation(periods, defaultLen){
    const next = this.predictNextPeriod(periods, defaultLen);
    if(!next.date) return {date:null, confidence:'low'};
    return {date: S.dt.addDays(next.date, -14), confidence: next.confidence};
  },
  analyzeBasalTemperature(temps){
    if(!temps || temps.length<4) return {rise:false, message:null};
    const sorted = [...temps].sort((a,b)=> S.dt.toSerial(a.date)-S.dt.toSerial(b.date));
    const last6 = sorted.slice(-6);
    if(last6.length<4) return {rise:false, message:null};
    const baseline = last6.slice(0,Math.max(3,last6.length-3)).reduce((a,t)=>a+t.value,0)/Math.max(3,last6.length-3);
    const recent = last6.slice(-3);
    const recentAvg = recent.reduce((a,t)=>a+t.value,0)/recent.length;
    const rise = (recentAvg - baseline) >= 0.2;
    return {rise, baseline:+baseline.toFixed(2), recentAvg:+recentAvg.toFixed(2)};
  },
  calculatePregnancyWeeks(lmpIso, refIso){
    if(!lmpIso) return {weeks:null, days:null};
    const total = S.dt.diffDays(lmpIso, refIso||S.dt.todayISO());
    if(total<0) return {weeks:null, days:null};
    return {weeks: Math.floor(total/7), days: total%7, totalDays: total};
  },
  calculateEDD(lmpIso, conceptionIso, providedEdd){
    if(providedEdd) return providedEdd;
    if(conceptionIso) return S.dt.addDays(conceptionIso, 266);
    if(lmpIso) return S.dt.addDays(lmpIso, 280);
    return null;
  },
  calculateTrimester(weeks){
    if(weeks==null) return null;
    if(weeks<13) return 1; if(weeks<27) return 2; return 3;
  },
  calculateContractionInterval(list){
    if(!list || list.length<2) return null;
    const sorted = [...list].sort((a,b)=> new Date(a.start)-new Date(b.start));
    const last2 = sorted.slice(-2);
    const intervalSec = (new Date(last2[1].start) - new Date(last2[0].start))/1000;
    return Math.round(intervalSec);
  },
  calculateImplantEndDate(insertionIso, durationMonths){
    if(!insertionIso || !durationMonths) return null;
    const {y,m,d} = S.dt.parse(insertionIso);
    const totalM = m - 1 + Number(durationMonths);
    const ny = y + Math.floor(totalM/12); const nm = (totalM%12)+1;
    const dim = new Date(Date.UTC(ny, nm, 0)).getUTCDate();
    return S.dt.toISO(ny, nm, Math.min(d, dim));
  }
};

/* ===================== SECURITY: PIN LOCK ===================== */
S.pinBuffer = ''; S.pinMode='verify'; S.pinFirstEntry=null; S.failCount=0; S.lockUntil=0;
S.security = null;

S.buildNumpad = function(){
  const grid = document.getElementById('numpad'); grid.innerHTML='';
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  keys.forEach(k=>{
    const b = document.createElement('button');
    if(k===''){ b.style.visibility='hidden'; } else { b.textContent=k; b.setAttribute('aria-label', k==='⌫'?'Effacer':k); }
    b.addEventListener('click', ()=> S.pinKeyPress(k));
    grid.appendChild(b);
  });
};
S.renderPinDots = function(){
  const wrap = document.getElementById('pinDots'); wrap.innerHTML='';
  for(let i=0;i<4;i++){ const d = document.createElement('span'); d.className='dot'+(i<S.pinBuffer.length?' filled':''); wrap.appendChild(d); }
};
S.pinKeyPress = async function(k){
  if(Date.now() < S.lockUntil) return;
  if(k==='⌫'){ S.pinBuffer = S.pinBuffer.slice(0,-1); S.renderPinDots(); return; }
  if(k==='' || S.pinBuffer.length>=4) return;
  S.pinBuffer += k; S.renderPinDots();
  if(S.pinBuffer.length===4){
    if(S.pinMode==='setup'){
      if(!S.pinFirstEntry){ S.pinFirstEntry = S.pinBuffer; S.pinBuffer=''; S.renderPinDots();
        document.getElementById('lockMsg').textContent = S.t('confirmPin');
      } else {
        if(S.pinFirstEntry===S.pinBuffer){
          const {hash,salt} = await S.crypto.hashPin(S.pinFirstEntry);
          await S.dbPut('security', {id:1, pinHash:hash, pinSalt:salt, autoLockMinutes:5, webauthnCredId:null});
          S.security = {id:1, pinHash:hash, pinSalt:salt, autoLockMinutes:5};
          S.toast(S.lang==='fr'?'Code PIN créé':'PIN created');
          S.finishBoot();
        } else {
          S.pinFirstEntry=null; S.pinBuffer='';
          document.getElementById('lockMsg').textContent = S.t('createPin');
          S.toast(S.t('wrongPin'));
        }
      }
    } else {
      const ok = await S.crypto.verifyPin(S.pinBuffer, S.security.pinHash, S.security.pinSalt);
      if(ok){ S.pinBuffer=''; S.failCount=0; S.showApp(); }
      else {
        S.failCount++; S.pinBuffer='';
        const delay = Math.min(30, Math.pow(2,S.failCount));
        S.lockUntil = Date.now() + delay*1000;
        document.getElementById('lockMsg').textContent = S.t('wrongPin')+' — '+S.t('tryAgainIn').replace('{n}', delay);
        setTimeout(()=>{ document.getElementById('lockMsg').textContent = S.t('lockEnterPin'); }, delay*1000);
      }
    }
  }
};
S.showLockSetup = function(){
  document.getElementById('screen-lock').classList.remove('hidden');
  document.getElementById('screen-onboarding').classList.add('hidden');
  document.getElementById('screen-splash').classList.add('hidden');
  S.pinMode='setup'; S.pinBuffer=''; S.pinFirstEntry=null;
  document.getElementById('lockMsg').textContent = S.t('createPin');
  document.getElementById('btnBiometric').classList.add('hidden');
  S.buildNumpad(); S.renderPinDots();
};
S.showLockVerify = function(){
  document.getElementById('screen-lock').classList.remove('hidden');
  document.getElementById('screen-onboarding').classList.add('hidden');
  document.getElementById('screen-splash').classList.add('hidden');
  document.getElementById('app').classList.add('hidden');
  S.pinMode='verify'; S.pinBuffer='';
  document.getElementById('lockMsg').textContent = S.t('lockEnterPin');
  const canBio = window.PublicKeyCredential && S.security && S.security.webauthnCredId && window.isSecureContext;
  document.getElementById('btnBiometric').classList.toggle('hidden', !canBio);
  S.buildNumpad(); S.renderPinDots();
};

    S.showApp();
  }catch(e){ S.toast('WebAuthn: '+ (e.message||'échec')); }
});

S.showApp = function(){

/* ===================== CANVAS CHARTS ===================== */
S.drawLineChart = function(canvas, points, opts){
  opts = opts||{};
  const dpr = window.devicePixelRatio||1;
  const cssW = canvas.clientWidth||320, cssH = 160;
  canvas.width = cssW*dpr; canvas.height = cssH*dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  const styles = getComputedStyle(document.documentElement);
  const ink = styles.getPropertyValue('--ink').trim()||'#172033';
  const primary = opts.color || styles.getPropertyValue('--primary').trim()||'#7C3AED';
  const border = styles.getPropertyValue('--border').trim()||'rgba(0,0,0,.1)';
  ctx.clearRect(0,0,cssW,cssH);
  if(!points.length){
    ctx.fillStyle = ink; ctx.globalAlpha=.5; ctx.font='13px sans-serif'; ctx.fillText(S.t('noData'), 10, cssH/2); return;
  }
  const pad = 24;
  const ys = points.map(p=>p.y);
  let minY = Math.min(...ys), maxY = Math.max(...ys);
  if(minY===maxY){ minY-=1; maxY+=1; }
  const spanY = maxY-minY;
  const stepX = points.length>1 ? (cssW-2*pad)/(points.length-1) : 0;
  ctx.strokeStyle = border; ctx.lineWidth=1;
  for(let i=0;i<=3;i++){ const y = pad + (cssH-2*pad)*i/3; ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(cssW-pad,y); ctx.stroke(); }
  ctx.beginPath(); ctx.strokeStyle = primary; ctx.lineWidth=2.2; ctx.lineJoin='round';
  points.forEach((p,i)=>{
    const x = pad + i*stepX; const y = cssH-pad - (p.y-minY)/spanY*(cssH-2*pad);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  ctx.fillStyle = primary;
  points.forEach((p,i)=>{
    const x = pad + i*stepX; const y = cssH-pad - (p.y-minY)/spanY*(cssH-2*pad);
    ctx.beginPath(); ctx.arc(x,y,2.6,0,7); ctx.fill();
  });
  ctx.fillStyle = ink; ctx.globalAlpha=.6; ctx.font='11px sans-serif'; ctx.textAlign='left';
  ctx.fillText(maxY.toFixed(1), 2, pad+4); ctx.fillText(minY.toFixed(1), 2, cssH-pad+2);
  canvas.setAttribute('role','img');
  canvas.setAttribute('aria-label', (opts.label||'Graphique') + ': ' + points.map(p=>p.y).join(', '));
};

S.calState = { y:new Date().getFullYear(), m:new Date().getMonth()+1 };

S.mountCalendar = function(){ S.renderCalendarGrid(); };
S.renderCalendarGrid = function(){
  const body = document.getElementById('calBody'); if(!body) return;
  const {y,m} = S.calState;
  const first = new Date(Date.UTC(y,m-1,1));
  const startDow = (first.getUTCDay()+6)%7; // Monday=0
  const daysInMonth = new Date(Date.UTC(y,m,0)).getUTCDate();
  const prevDays = new Date(Date.UTC(y,m-1,0)).getUTCDate();
  const dows = S.lang==='fr' ? ['L','M','M','J','V','S','D'] : ['M','T','W','T','F','S','S'];
  const st = S.state;
  const fw = S.calc.estimateFertileWindow(st.periods, st.settings.avgCycleLength);
  const ovu = S.calc.estimateOvulation(st.periods, st.settings.avgCycleLength);
  const todayIso = S.dt.todayISO();

  function dayInfo(iso){
    const info = {period:false, fertile:false, ovu:false, log:false};
    st.periods.forEach(p=>{ const s=S.dt.toSerial(p.startDate), e=p.endDate?S.dt.toSerial(p.endDate):s; const c=S.dt.toSerial(iso); if(c>=s&&c<=e) info.period=true; });
    if(fw.start && iso>=fw.start && iso<=fw.end) info.fertile=true;
    if(ovu.date===iso) info.ovu=true;
    if(st.dailyLogs.some(l=>l.date===iso) || st.temperatures.some(t=>t.date===iso)) info.log=true;
    return info;
  }
  let cells = '';
  for(let i=0;i<startDow;i++){ const d = prevDays-startDow+1+i; cells += `<div class="cal-day out">${d}</div>`; }
  for(let d=1; d<=daysInMonth; d++){
    const iso = S.dt.toISO(y,m,d); const info = dayInfo(iso);
    const dots = [info.period&&'<span class="dot-period"></span>', info.fertile&&'<span class="dot-fertile"></span>', info.ovu&&'<span class="dot-ovu"></span>', info.log&&'<span class="dot-log"></span>'].filter(Boolean).join('');
    cells += `<button class="cal-day ${iso===todayIso?'today':''}" data-date="${iso}" aria-label="${iso}"><span>${d}</span><span class="dots">${dots}</span></button>`;
  }
  const totalCells = startDow+daysInMonth; const trailing = (7-(totalCells%7))%7;
  for(let d=1; d<=trailing; d++){ cells += `<div class="cal-day out">${d}</div>`; }

  body.innerHTML = `
    <div class="cal-head">
      <button class="btn-ghost" id="calPrev" aria-label="Mois précédent">←</button>
      <strong>${S.dt.monthLabel(y,m)}</strong>
      <button class="btn-ghost" id="calNext" aria-label="Mois suivant">→</button>
    </div>
    <div class="row" style="margin-bottom:8px"><button class="btn-secondary" id="calToday">${S.t('today')}</button>
      <button class="btn-primary" id="calAddPeriod" style="margin-left:auto">${S.t('qaPeriod')}</button></div>
    <div class="cal-grid">${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
    <div class="row muted" style="gap:14px;margin-top:12px;font-size:12px">
      <span><span class="dot-period" style="display:inline-block;width:8px;height:8px;border-radius:50%"></span> ${S.t('periods')}</span>
      <span><span class="dot-fertile" style="display:inline-block;width:8px;height:8px;border-radius:50%"></span> ${S.t('fertileWindow')}</span>
      <span><span class="dot-ovu" style="display:inline-block;width:8px;height:8px;border-radius:50%"></span> ${S.t('ovulation')}</span>
      <span><span class="dot-log" style="display:inline-block;width:8px;height:8px;border-radius:50%"></span> ${S.t('navJournal')}</span>
    </div>
    <div class="disclaimer" style="margin-top:12px">⚠️ ${S.t('fertilityWarning')}</div>
  `;
  document.getElementById('calPrev').addEventListener('click', ()=>{ S.calState.m--; if(S.calState.m<1){S.calState.m=12;S.calState.y--;} S.renderCalendarGrid(); });
  document.getElementById('calNext').addEventListener('click', ()=>{ S.calState.m++; if(S.calState.m>12){S.calState.m=1;S.calState.y++;} S.renderCalendarGrid(); });
  document.getElementById('calToday').addEventListener('click', ()=>{ const n=new Date(); S.calState={y:n.getFullYear(),m:n.getMonth()+1}; S.renderCalendarGrid(); });
  document.getElementById('calAddPeriod').addEventListener('click', ()=> S.openPeriodForm());
  body.querySelectorAll('.cal-day[data-date]').forEach(c=> c.addEventListener('click', ()=> S.openDayPanel(c.dataset.date)));
};

  const body = `

  <div class="row" style="margin-top:14px">
    <button class="btn-secondary" id="pregJournalBtn">${S.lang==='fr'?'Journal grossesse':'Pregnancy journal'}</button>
    <button class="btn-secondary" id="pregEditBtn">${S.t('edit')}</button>
    <button class="btn-ghost" id="pregEndBtn">${S.lang==='fr'?'Terminer le suivi':'End tracking'}</button>

  ${logs.length? `<h2 style="margin-top:18px;font-size:16px">${S.lang==='fr'?'Journal récent':'Recent journal'}</h2><table class="hist"><tr><th>${S.t('date')}</th><th>${S.t('mood')}</th><th>${S.t('weight')}</th></tr>${logs.slice(0,10).map(l=>`<tr><td>${S.dt.fmt(l.date)}</td><td>${l.mood??'—'}</td><td>${l.weight??'—'}</td></tr>`).join('')}</table>` : ''}

S.ctInterval = null;
S.mountContractions = function(){
  const btn = document.getElementById('ctBtn');
  btn.addEventListener('click', async ()=>{
    if(!S.contractionActive){
      S.contractionActive = {start: new Date().toISOString()};
      S.ctTick0 = Date.now();
      S.ctInterval = setInterval(()=>{
        const sec = Math.floor((Date.now()-S.ctTick0)/1000);
        const el = document.getElementById('ctTimerNum'); if(el) el.textContent = `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
      }, 500);
      S.renderView();
    } else {
      clearInterval(S.ctInterval);
      const end = new Date().toISOString();
      const duration = (new Date(end)-new Date(S.contractionActive.start))/1000;
      await S.dbAdd('contractions', {start:S.contractionActive.start, end, duration});
      S.contractionActive = null;
      await S.reloadAll(); S.renderView();
    }
  });
};

S.exportJSON = async function(){
  const data = {__serena__:true, version:1, exportedAt:new Date().toISOString()};
  for(const store of S.STORES){ data[store] = await S.dbGetAll(store); }
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download = `serena-export-${S.dt.todayISO()}.json`; a.click();
  URL.revokeObjectURL(url);
  S.toast(S.lang==='fr'?'Export terminé':'Export complete');
};

S.buildPrintReport = function(selected){

  let html = `<div style="padding:24px;font-family:Georgia,serif;max-width:760px;margin:0 auto">

  if(selected.includes('cycle')){
    const avg = S.calc.calculateAverageCycleLength(st.periods);
    html += `<h2>${S.t('periods')}</h2><p>${S.t('avgCycle')}: ${avg.value??'—'} j</p>`;

  }
  if(selected.includes('temperature')){
    html += `<h2>${S.t('navTemperature')}</h2><table border="1" cellpadding="4" style="border-collapse:collapse;width:100%"><tr><th>${S.t('date')}</th><th>°</th></tr>${st.temperatures.map(t=>`<tr><td>${t.date}</td><td>${t.value}°${t.unit}</td></tr>`).join('')}</table>`;
  }
  if(selected.includes('journal')){
    html += `<h2>${S.t('navJournal')}</h2><table border="1" cellpadding="4" style="border-collapse:collapse;width:100%"><tr><th>${S.t('date')}</th><th>${S.t('mood')}</th><th>${S.t('pain')}</th><th>${S.t('symptoms')}</th></tr>${st.dailyLogs.map(l=>`<tr><td>${l.date}</td><td>${l.mood??''}</td><td>${l.pain??''}</td><td>${(l.symptoms||[]).join(', ')}</td></tr>`).join('')}</table>`;
  }
  if(selected.includes('sexual')){
    html += `<h2>${S.t('navSexual')}</h2><p style="font-size:12px">${S.t('sexualWarning')}</p><table border="1" cellpadding="4" style="border-collapse:collapse;width:100%"><tr><th>${S.t('date')}</th><th>${S.lang==='fr'?'Protégé':'Protected'}</th></tr>${st.sexualActivity.map(a=>`<tr><td>${a.date}</td><td>${a.protected?'✔':'—'}</td></tr>`).join('')}</table>`;
  }
  if(selected.includes('implant') && st.implant){
    html += `<h2>${S.t('navImplant')}</h2><p>${st.implant.name||st.implant.type} — ${S.dt.fmt(st.implant.insertionDate)} → ${S.dt.fmt(S.calc.calculateImplantEndDate(st.implant.insertionDate, st.implant.durationMonths))}</p>`;
  }
  if(selected.includes('pregnancy') && st.pregnancy){
    const w = S.calc.calculatePregnancyWeeks(st.pregnancy.lmpDate);

S.runSelfTests = async function(){
  const tests = [];
  try{ const r = S.calc.predictNextPeriod([{startDate:'2026-01-01'},{startDate:'2026-01-29'}], 28); tests.push({name:'predictNextPeriod', ok: !!r.date}); }catch(e){ tests.push({name:'predictNextPeriod', ok:false, error:e.message}); }
  try{ const {hash,salt} = await S.crypto.hashPin('1234'); const ok = await S.crypto.verifyPin('1234', hash, salt); tests.push({name:'crypto PIN', ok}); }catch(e){ tests.push({name:'crypto PIN', ok:false, error:e.message}); }
  try{ await S.dbAdd('settings', {__test:true}); tests.push({name:'IndexedDB write', ok:true}); }catch(e){ tests.push({name:'IndexedDB write', ok:false, error:e.message}); }
  try{ const iso = S.dt.addDays('2026-01-31', 1); tests.push({name:'date add (no TZ drift)', ok: iso==='2026-02-01'}); }catch(e){ tests.push({name:'date', ok:false, error:e.message}); }
  try{ const end = S.calc.calculateImplantEndDate('2026-01-31', 1); tests.push({name:'implant end date', ok: !!end}); }catch(e){ tests.push({name:'implant end date', ok:false, error:e.message}); }
  return tests;
};

S.loadDemoData = async function(){
  const today = S.dt.todayISO();
  for(let i=3;i>=0;i--){ await S.dbAdd('periods', {startDate:S.dt.addDays(today, -28*i-2), endDate:S.dt.addDays(today,-28*i+3), flow:'medium', notes:'[DEMO]'}); }
  for(let i=0;i<10;i++){ await S.dbAdd('temperatures', {date:S.dt.addDays(today,-i), time:'07:00', value:+(36.4+(i>6?0.3:0)+Math.random()*0.1).toFixed(2), unit:'C', method:'basal', note:'[DEMO]'}); }
  for(let i=0;i<10;i++){ await S.dbAdd('dailyLogs', {date:S.dt.addDays(today,-i), mood:1+Math.floor(Math.random()*5), pain:Math.floor(Math.random()*3), energy:Math.floor(Math.random()*10), sleep:Math.floor(Math.random()*10), libido:Math.floor(Math.random()*10), symptoms:['fatigue'], notes:'[DEMO]'}); }
  await S.dbAdd('sexualActivity', {date:S.dt.addDays(today,-5), protected:true, notes:'[DEMO]'});
  await S.dbPut('implant', {id:1, type:'Implant', name:'DEMO-implant', insertionDate:S.dt.addDays(today,-200), durationMonths:36, arm:'left', notes:'[DEMO]'});
  await S.dbAdd('appointments', {date:S.dt.addDays(today,10), time:'10:00', professional:'Dr Demo', facility:'Clinique Demo', type:'consultation', notes:'[DEMO]'});
  S.state.settings.demoLoaded = true;
};
S.clearDemoData = async function(){
  for(const store of ['periods','temperatures','dailyLogs','sexualActivity','appointments']){
    const all = await S.dbGetAll(store);
    for(const item of all){ if(item.notes==='[DEMO]') await S.dbDelete(store, item.id); }
  }
  const imp = await S.dbGetAll('implant'); if(imp[0] && imp[0].notes==='[DEMO]') await S.dbClear('implant');
  await S.reloadAll();
};

/* ===================== PWA: MANIFEST + SERVICE WORKER + INSTALL ===================== */
S.deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{ e.preventDefault(); S.deferredInstallPrompt = e; });
S.setupPWA = function(){
  try{
    const manifest = {
      name:'SERENA', short_name:'SERENA', start_url:'.', display:'standalone',
      background_color:'#F8FAFC', theme_color:'#7C3AED',
      icons:[{src:S.iconDataURI(), sizes:'192x192', type:'image/svg+xml'}]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('link'); link.rel='manifest'; link.href=url; document.head.appendChild(link);
  }catch(e){}
  if('serviceWorker' in navigator && window.isSecureContext){
    try{
      const swCode = `self.addEventListener('install',e=>self.skipWaiting()); self.addEventListener('activate',e=>self.clients.claim()); self.addEventListener('fetch', e=>{});`;
      const blob = new Blob([swCode], {type:'text/javascript'});
      const url = URL.createObjectURL(blob);
      navigator.serviceWorker.register(url).catch(()=>{ /* silently ignore: Blob SW registration may be disallowed */ });
    }catch(e){}
  }
};
S.iconDataURI = function(){
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='34' fill='none' stroke='%237C3AED' stroke-width='9'/><circle cx='62' cy='42' r='24' fill='%23F8FAFC'/></svg>`;
  return 'data:image/svg+xml,'+svg;
};

/* ===================== INITIALIZATION ===================== */
document.addEventListener('DOMContentLoaded', ()=>{
  S.setupPWA();
  S.boot();
});
